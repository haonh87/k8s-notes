server {
    listen 80;   # Lắng nghe cổng 80

    server_name _;  # Dùng cho tất cả các tên miền

    location / {
        proxy_pass http://localhost:3000;  # Proxy request đến Vue.js dev server ở cổng 3000
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;  # Hỗ trợ WebSocket
        proxy_set_header Connection 'upgrade';  # Hỗ trợ WebSocket
        proxy_set_header Host $host;  # Giữ nguyên header Host
        proxy_cache_bypass $http_upgrade;  # Bỏ qua cache cho WebSocket

        # Đảm bảo tất cả các header sau đây được gửi đi đúng
        proxy_set_header X-Real-IP $remote_addr;  # Địa chỉ IP thực của client
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;  # Địa chỉ IP của client (qua proxy)
        proxy_set_header X-Forwarded-Proto $scheme;  # HTTP/HTTPS scheme
    }
}